site_name: OpenSaw
site_description: Локальный AI-ассистент с душой и инструментами
site_url: https://bitplugg.github.io/opensaw
repo_url: https://github.com/bitplugg/opensaw
repo_name: bitplugg/opensaw

theme:
  name: material
  language: ru
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/logo.svg

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bitplugg/opensaw
  generator: false

copyright: Copyright &copy; 2026 OpenSaw Team

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji
  - pymdownx.details
  - pymdownx.keys
  - admonition
  - toc:
      permalink: true
      title: На этой странице
  - attr_list
  - md_in_html
  - def_list

nav:
  - Главная: index.md
  - Установка:
    - Быстрый старт: setup.md
    - GGUF на слабых CPU: gguf.md
    - Выбор модели: model-guide.md
  - Использование:
    - CLI Reference: cli-reference.md
    - Система памяти: memory-system.md
    - Инструменты AI: tools-reference.md
  - Плагины:
    - Система плагинов: plugins.md
    - OpenSawCore SDK: opensawcore.md
    - Написание плагина: writing-plugins.md
    - Примеры плагинов: plugin-examples.md
  - Разработка:
    - API сервер: api.md
    - Архитектура: architecture.md
  - Справка:
    - Troubleshooting: troubleshooting.md
    - FAQ: faq.md
